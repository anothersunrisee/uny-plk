name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Quartz Site
        run: |
          git clone --depth 1 -b v4 https://github.com/jackyzha0/quartz.git ../quartz
          cd ../quartz
          npm ci
          npx quartz create -X new -l shortest
          rm -rf content/*
          cp -r "$GITHUB_WORKSPACE"/* content/ || true
          node -e '
            const fs = require("fs");
            let cfg = fs.readFileSync("quartz.config.ts", "utf8");
            cfg = cfg.replace(/pageTitle: "[^"]*"/, "pageTitle: \"PLK UNY Mengabdi 2027\"");
            cfg = cfg.replace(/baseUrl: "[^"]*"/, "baseUrl: \"anothersunrisee.github.io/uny-plk\"");
            fs.writeFileSync("quartz.config.ts", cfg);
          '
          npx quartz build -o "$GITHUB_WORKSPACE/public"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
